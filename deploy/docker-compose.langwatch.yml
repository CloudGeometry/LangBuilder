# =============================================================================
# LangWatch — App + NLP + LangEvals + Postgres + Redis + OpenSearch
# =============================================================================
# Usage:
#   docker compose -f docker-compose.langwatch.yml --env-file .env up -d
#
# Requires: docker network create langbuilder-network (once)
#
# Note: LangWatch images use :latest — official compose does the same and
# versioned tags are inconsistent across sub-images. Pin when they stabilize.
# =============================================================================

services:
  langwatch:
    image: langwatch/langwatch:latest
    container_name: langwatch
    restart: unless-stopped
    depends_on:
      langbuilder-postgres:
        condition: service_healthy
      langwatch-redis:
        condition: service_healthy
      langwatch-opensearch:
        condition: service_healthy
    ports:
      - "${LW_APP_PORT:-5560}:5560"
    environment:
      - DATABASE_URL=postgresql://${LW_POSTGRES_USER:-langwatch}:${LW_POSTGRES_PASSWORD:-langwatch}@langbuilder-postgres:5432/${LW_POSTGRES_DB:-langwatch}
      - REDIS_URL=redis://langwatch-redis:6379
      - ELASTICSEARCH_NODE_URL=http://langwatch-opensearch:9200
      - IS_OPENSEARCH=true
      - LANGWATCH_NLP_SERVICE=http://langwatch-nlp:5561
      - LANGEVALS_ENDPOINT=http://langwatch-langevals:5562
      - NEXTAUTH_SECRET=${LW_NEXTAUTH_SECRET:?LW_NEXTAUTH_SECRET is required}
      - NEXTAUTH_URL=${LW_NEXTAUTH_URL:-http://localhost:5560}
      - BASE_HOST=${LW_BASE_HOST:-http://localhost:5560}
      - NODE_ENV=production
      - SKIP_ENV_VALIDATION=true
      - INSTALL_METHOD=docker
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5560"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - langbuilder-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  langwatch-nlp:
    image: langwatch/langwatch_nlp:latest
    container_name: langwatch-nlp
    restart: unless-stopped
    environment:
      - LANGWATCH_ENDPOINT=http://langwatch:5560
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - langbuilder-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  langwatch-langevals:
    image: langwatch/langevals:latest
    container_name: langwatch-langevals
    restart: unless-stopped
    environment:
      - DISABLE_EVALUATORS_PRELOAD=true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - langbuilder-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # langwatch-postgres:
  #   image: postgres:16.6-alpine
  #   container_name: langwatch-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${LW_POSTGRES_USER:-langwatch}
  #     POSTGRES_PASSWORD: ${LW_POSTGRES_PASSWORD:-langwatch}
  #     POSTGRES_DB: ${LW_POSTGRES_DB:-langwatch}
  #     PGDATA: /var/lib/postgresql/data/pgdata
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 512m
  #         cpus: "0.5"
  #   volumes:
  #     - langwatch-postgres-data:/var/lib/postgresql/data/pgdata
  #   healthcheck:
  #     test:
  #       [
  #         "CMD-SHELL",
  #         "pg_isready -U ${LW_POSTGRES_USER:-langwatch} -d ${LW_POSTGRES_DB:-langwatch}",
  #       ]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s
  #   networks:
  #     - langbuilder-network
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  langwatch-redis:
    image: redis:7.4-alpine
    container_name: langwatch-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    volumes:
      - langwatch-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - langbuilder-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  langwatch-opensearch:
    image: langwatch/opensearch-lite:latest
    container_name: langwatch-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=${LW_OPENSEARCH_JAVA_OPTS:--Xms256m -Xmx512m}
      - cluster.routing.allocation.disk.threshold_enabled=false
      - bootstrap.memory_lock=false
      - node.store.allow_mmap=false
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"
    volumes:
      - langwatch-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - langbuilder-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  langwatch-postgres-data:
  langwatch-redis-data:
  langwatch-opensearch-data:

networks:
  langbuilder-network:
    external: true
