# =============================================================================
# OpenWebUI — Our GHCR Fork
# =============================================================================
# Usage:
#   docker compose -f docker-compose.openwebui.yml --env-file .env up -d
#
# Requires: docker network create langbuilder-network (once)
#
# Database migration (SQLite → Postgres):
#   1. Set OPENWEBUI_DATABASE_URL in .env to a postgresql:// connection string
#   2. OpenWebUI auto-converts postgres:// → postgresql:// (env.py:301-302)
#   3. Restart the service
# =============================================================================

services:
  openwebui:
    image: ghcr.io/cloudgeometry/openwebui:${OPENWEBUI_TAG:-latest}
    container_name: openwebui
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=${OPENWEBUI_DATABASE_URL:-sqlite:///app/backend/data/webui.db}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-}
      - ENABLE_OAUTH_SIGNUP=${ENABLE_OAUTH_SIGNUP:-true}
      - ENABLE_LOGIN_FORM=${ENABLE_LOGIN_FORM:-true}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - WEBUI_SESSION_COOKIE_SAME_SITE=${WEBUI_SESSION_COOKIE_SAME_SITE:-lax}
      - WEBUI_SESSION_COOKIE_SECURE=${WEBUI_SESSION_COOKIE_SECURE:-false}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - SCARF_NO_ANALYTICS=${SCARF_NO_ANALYTICS:-true}
      - DO_NOT_TRACK=${DO_NOT_TRACK:-true}
      - ANONYMIZED_TELEMETRY=${ANONYMIZED_TELEMETRY:-false}
    volumes:
      - openwebui-app-data:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - langbuilder-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openwebui-app-data:

networks:
  langbuilder-network:
    external: true
